[package]
name = "vless-rust"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Independent VLESS Encryption and experimental REALITY server, wire reference Xray-core v26.11.9"

[dependencies]
anyhow = "=1.0.104"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
blake3 = { version = "=1.8.7", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
ctr = "=0.9.2"
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc", "zeroize"] }
ml-kem = { version = "=0.3.4", features = ["getrandom", "zeroize"] }
rand = "=0.8.8"
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
socket2 = { version = "=0.6.5", features = ["all"] }
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.9.2"

[patch.crates-io]
rustls = { path = "vendor/rustls" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
