name: Build Rust core release

on:
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - "tests/**"
      - "install.sh"
      - ".github/workflows/rust-core-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.100.0
      - name: Rust tests
        working-directory: rust-core
        run: cargo test --locked
      - name: Rust clippy
        working-directory: rust-core
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Deployment/menu regression tests
        run: python3 tests/regression.py
      - name: Build release binary
        working-directory: rust-core
        run: cargo build --locked --release
      - name: Package binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 rust-core/target/release/vless-rust "dist/vless-rust-linux-${{ matrix.arch }}"
          sha256sum "dist/vless-rust-linux-${{ matrix.arch }}" | awk '{print $1}' > "dist/vless-rust-linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: vless-rust-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            rust-core/Cargo.toml
            rust-core/venc
            rust-core/install.sh
            rust-core/systemd/
      - uses: actions/download-artifact@v8
        with:
          pattern: vless-rust-*
          path: dist
          merge-multiple: true
      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' rust-core/Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package management command
        run: |
          install -m 0755 rust-core/venc dist/venc
          sha256sum dist/venc | awk '{print $1}' > dist/venc.sha256
          tar -czf dist/vless-rust-deploy.tar.gz -C rust-core install.sh venc systemd/vless-rust.service 'systemd/vless-rust@.service'
          sha256sum dist/vless-rust-deploy.tar.gz | awk '{print $1}' > dist/vless-rust-deploy.tar.gz.sha256
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: vless-rust-v${{ steps.package.outputs.version }}
          name: vless-rust ${{ steps.package.outputs.version }}
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: dist/*
